<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact & footer | I-Net Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="icon" href="../assets/logo2.png"><link rel="stylesheet" href="css/admin.css"><script src="../api/boot.php?admin=1"></script></head><body data-page="contact.html" data-title="Contact & footer"><aside id="side"></aside><div class="main"><header id="top"></header><main class="content">
<!-- API: GET /api/contact | PUT /api/contact | GET /api/site | PUT /api/site. contact: hero, form, info[], mapQuery, next. site (header, footer, phones): navBtn, phone1, phone2, whatsapp, address, copyright, menu[], footerLinks[]. -->
<div class="ph"><div><i class="dash"></i><h2>Contact &amp; footer</h2><p>The Contact page text, plus the phone numbers, address, menu and footer shown on every page.</p></div></div>
<div class="tabs" role="tablist"><button class="on" data-t="contact" role="tab">Contact page</button><button data-t="site" role="tab">Header and footer (all pages)</button></div>
<section id="contact">
<div id="banner"></div>
<div class="panel"><h3>Enquiry form</h3><div class="pb"><div class="g2"><label>Send button text<input data-b="form.button"></label><label>Message after sending<input data-b="form.success"></label></div><p class="mut">The “Course of interest” list is filled from the <a href="courses.html"><b>Courses</b></a> page.</p></div></div>
<div class="panel"><div class="phd"><span style="font-weight:700">Contact details box</span><button class="btn ghost" data-add="info" type="button"><i class="fa-solid fa-plus"></i>Add line</button></div><div class="pb"><div id="info"></div><label>Map address <small>(shown on the Google map)</small><input data-b="mapQuery"></label></div></div>
<div class="panel"><div class="phd"><span style="font-weight:700">“What happens next” steps</span><button class="btn ghost" data-add="steps" type="button"><i class="fa-solid fa-plus"></i>Add step</button></div><div class="pb"><div class="g2"><label>Heading<input data-b="next.title"></label><label>Sub text<input data-b="next.p"></label></div><div id="steps"></div></div></div>
<div class="savebar"><button class="btn" id="saveC">Save contact page</button></div></section>
<section id="site" hidden>
<div class="panel"><h3>Phone, address and button</h3><div class="pb"><div class="g2"><label>Phone 1<input data-s="phone1"></label><label>Phone 2<input data-s="phone2"></label></div><div class="g2"><label>WhatsApp number <small>(digits with country code)</small><input data-s="whatsapp"></label><label>Header button text<input data-s="navBtn"></label></div><label>Address in the footer<input data-s="address"></label><label>Copyright line<input data-s="copyright"></label></div></div>
<div class="panel"><div class="phd"><span style="font-weight:700">Top menu</span><button class="btn ghost" data-add="menu" type="button"><i class="fa-solid fa-plus"></i>Add link</button></div><div class="pb"><div id="menu"></div></div></div>
<div class="panel"><div class="phd"><span style="font-weight:700">Footer links</span><button class="btn ghost" data-add="footerLinks" type="button"><i class="fa-solid fa-plus"></i>Add link</button></div><div class="pb"><div id="footerLinks"></div></div></div>
<div class="savebar"><button class="btn" id="saveS">Save header and footer</button></div></section>
</main></div><script src="js/seed.js"></script><script src="js/content.js"></script><script src="js/admin.js"></script>
<script>
const C=load('contact'),S=load('site');$('#banner').innerHTML=BANNER();bindB(C);
$$('[data-s]').forEach(i=>{i.value=S[i.dataset.s]??'';i.oninput=()=>S[i.dataset.s]=i.value});
rep('info',C.info,[{k:'l',l:'Label',w:'w2'},{k:'v',l:'Text',w:'w4'}],{l:'',v:''});
rep('steps',C.next.steps,[{k:'t',l:'Step title',w:'w2'},{k:'d',l:'Description',w:'w4'}],{t:'',d:''});
const LK=[{k:'l',l:'Link text',w:'w2'},{k:'href',l:'Link address',w:'w4'}];rep('menu',S.menu,LK,{l:'',href:''});rep('footerLinks',S.footerLinks,LK,{l:'',href:''});
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#contact').hidden=b.dataset.t!=='contact';$('#site').hidden=b.dataset.t!=='site'});
$('#saveC').onclick=()=>{Store.set('contact',C);toast('Contact page saved')};$('#saveS').onclick=()=>{Store.set('site',S);toast('Header and footer saved')};
</script></body></html>
