<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery | I-Net Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="icon" href="../assets/logo2.png"><link rel="stylesheet" href="css/admin.css"><script src="../api/boot.php?admin=1"></script></head><body data-page="gallery.html" data-title="Gallery"><aside id="side"></aside><div class="main"><header id="top"></header><main class="content">
<!-- API: GET /api/gallery | PUT /api/gallery. JSON: hero, wall{a,b}, items[] with img, alt, pos, fit. Order = order on the moving wall. -->
<div class="ph"><div><i class="dash"></i><h2>Gallery</h2><p>The heading and the pictures on the moving wall of the Gallery page. Press Save changes when you are done.</p></div></div>
<div id="banner"></div>
<div class="panel"><h3>Wall heading</h3><div class="pb"><div class="g2"><label>First words<input data-b="wall.a"></label><label>Highlighted word<input data-b="wall.b"></label></div></div></div>
<div class="panel"><div class="phd"><span style="font-weight:700">Wall pictures</span><span style="display:flex;gap:8px"><label class="btn ghost" style="cursor:pointer"><i class="fa-solid fa-upload"></i>Upload pictures<input type="file" id="gup" accept="image/*" multiple hidden></label><button class="btn ghost" data-add="items" type="button"><i class="fa-solid fa-plus"></i>Add picture</button></span></div><div class="pb"><div id="items"></div><p class="hint">Use “Contain” for logos so they are not cropped. Focus is where a cropped photo is centred, for example “center 12%”.</p></div></div>
<div class="savebar"><button class="btn" id="save">Save changes</button></div>
</main></div><script src="js/seed.js"></script><script src="js/content.js"></script><script src="js/admin.js"></script>
<script>
const G=load('gallery');$('#banner').innerHTML=BANNER();bindB(G);
const R=()=>rep('items',G.items,[{k:'img',l:'Picture',w:'w2',o:SEED.media},{k:'alt',l:'Description (alt text)',w:'w2'},{k:'pos',l:'Focus',w:'w1'},{k:'fit',l:'Fit',w:'w1',o:['','contain','cover']}],{img:SEED.media[0],alt:'',pos:'',fit:''});R();
$('#gup').onchange=async e=>{let n=0;for(const f of e.target.files){const u=await readFile(f);if(u){G.items.push({img:u,alt:'',pos:'',fit:''});n++}}e.target.value='';R();if(n){Store.set('gallery',G);toast(n+' picture(s) uploaded and saved')}};
$('#save').onclick=()=>{Store.set('gallery',G);toast('Gallery saved')};
</script></body></html>
